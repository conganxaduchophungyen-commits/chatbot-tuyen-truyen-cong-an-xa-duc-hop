version: '3.8'

services:
  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: duchop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_tuyen_truyen}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api_backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: duchop_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_db:5432/${POSTGRES_DB:-chatbot_tuyen_truyen}
      - SECRET_KEY=${SECRET_KEY:-super_secret_key_cong_an_xa_duc_hop}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres_db
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/static/uploads

  web_frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: duchop_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=http://api_backend:8000
    depends_on:
      - api_backend
    ports:
      - "3000:3000"

  nginx_gateway:
    image: nginx:alpine
    container_name: duchop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web_frontend
      - api_backend

volumes:
  postgres_data:
